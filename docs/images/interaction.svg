<svg xmlns="http://www.w3.org/2000/svg" width="840" height="150" viewBox="0 0 840 150" role="img" aria-labelledby="title desc">
<title id="title">Psst interaction</title><desc id="desc">Hold Option Space and speak, release to submit, then glance at the answer.</desc>
<rect width="840" height="150" rx="24" fill="#15151b"/>
<g fill="#f6f5fb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">
<rect x="32" y="27" width="216" height="58" rx="14" fill="#2b2b36" stroke="#575268"/>
<text x="140" y="64" font-size="24">⌥ Space</text><text x="140" y="117" font-size="17">Hold and speak</text>
<text x="280" y="66" font-size="28" fill="#aba1d0">→</text>
<text x="420" y="64" font-size="24">Release</text><text x="420" y="117" font-size="17">Answer starts streaming</text>
<text x="560" y="66" font-size="28" fill="#aba1d0">→</text>
<text x="700" y="64" font-size="24">Glance</text><text x="700" y="117" font-size="17">Keep your focus</text>
</g></svg>
